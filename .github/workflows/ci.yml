# CI: run the test suite and lint on every push/PR.
#
# NOTE: written and reviewed for correctness but NOT executed here (this
# sandbox has no network access to actually dispatch a GitHub Actions run).
# The steps mirror exactly what was manually run to validate this repo
# throughout development, so they should work, but "should" is doing some
# work in that sentence -- verify on your first real push.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Torch-dependent model tests
        run: pytest tests/test_models.py -v
        # These auto-skip via pytest.importorskip("torch") if torch failed
        # to install for some reason -- shouldn't happen in CI (unlike the
        # offline sandbox this repo was built in) but kept non-fatal just in case.
        continue-on-error: false
