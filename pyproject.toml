[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiofusion-ai"
version = "0.1.0"
description = "Robust Multimodal ECG-PPG Fusion for Early Cardiovascular Risk Detection in Wearable Devices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["preprocessing*", "models*", "training*", "evaluation*", "visualization*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]  # pyflakes, pycodestyle, isort, warnings
ignore = ["E501"]  # line length handled by the line-length setting above, not as a hard error
